[workspace]
members = ["crates/backend", "crates/cli", "crates/core", "crates/ingestion"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["OctoFHIR Team"]
license = "MIT OR Apache-2.0"
[workspace.dependencies]
# Web Framework
axum = "0.8"
tokio = { version = "1", default-features = false }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "trace"] }

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "macros", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "=1.4.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"

# Error Handling
anyhow = "1"
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2", "charset", "system-proxy"] }
# Preserve the existing platform TLS backend and OS trust store rather than
# enabling reqwest 0.13's default Rustls/AWS-LC stack.
tar = "0.4"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

hex = "0.4"

# Async trait
async-trait = "0.1"

# Static file embedding
rust-embed = "8"
mime_guess = "2"
