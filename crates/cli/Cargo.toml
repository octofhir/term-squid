[package]
name = "term-squid-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "term-squid-cli"
path = "src/main.rs"

[dependencies]
term-squid-ingestion = { path = "../ingestion" }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
term-squid-core = { path = "../core" }
# CLI
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }

# Database
sqlx.workspace = true

# HTTP Client
reqwest.workspace = true
indicatif.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
csv.workspace = true

# Compression
tar.workspace = true
flate2.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error Handling
anyhow.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true
futures-util.workspace = true
sha2 = "0.11"
hex.workspace = true
