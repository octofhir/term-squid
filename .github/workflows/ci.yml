name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: termsquid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres || true

      - name: Run database migrations
        run: |
          cd crates/backend
          sqlx database create
          sqlx migrate run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/termsquid_test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --workspace --verbose -- --include-ignored
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/termsquid_test
          TERM_SQUID_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/termsquid_test

  benchmark-harness:
    name: Benchmark correctness gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Test benchmark harness
        run: bun test benchmarks

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  core-dependencies:
    name: Independent core without transports or SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/core-consumer
      - run: cargo run --manifest-path tests/core-consumer/Cargo.toml
      - name: Guard library dependency boundary
        run: |
          python3 - <<'PY'
          import re, subprocess
          graph = subprocess.check_output([
              "cargo", "tree", "--manifest-path", "tests/core-consumer/Cargo.toml",
              "--edges", "normal,build", "--prefix", "none", "--format", "{p}",
          ], text=True)
          forbidden = re.findall(r"^(?:tokio|reqwest|hyper|rustls|native-tls|openssl-sys|sqlx|sqlx-core|sqlx-postgres|regex|fuzzy-matcher) v.*", graph, re.M)
          if forbidden:
              raise SystemExit("Unexpected core dependencies: " + ", ".join(forbidden))
          PY
