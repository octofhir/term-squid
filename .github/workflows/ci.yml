name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    needs: frontend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: termsquid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Clear embedded build output
        run: rm -rf crates/backend/static && mkdir -p crates/backend/static

      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: crates/backend/static

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run database migrations
        run: cargo run --locked --bin term-squid-cli -- --database-url "$DATABASE_URL" migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/termsquid_test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --workspace --verbose -- --include-ignored
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/termsquid_test
          TERM_SQUID_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/termsquid_test

  benchmark-harness:
    name: Benchmark correctness gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Test benchmark harness
        run: bun test benchmarks

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check frontend
        run: pnpm run lint && pnpm run test && pnpm run typecheck
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: crates/backend/static
          retention-days: 7

  browser:
    name: Embedded production UI
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: termsquid_ui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Clear embedded build output
        run: rm -rf crates/backend/static && mkdir -p crates/backend/static

      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: crates/backend/static
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install browser test dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Build embedded release after frontend
        run: cargo build --locked --release --bin backend --bin term-squid-cli
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Generate local fixtures
        run: bun benchmarks/bench.ts fixtures
      - name: Test production application and restart recovery
        run: python3 benchmarks/ui_admin_smoke.py --database-url postgres://postgres:postgres@127.0.0.1:5432/termsquid_ui_test
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-admin-browser-evidence
          path: |
            .benchmarks/ui-admin/screenshots
            .benchmarks/ui-admin/browser-results
          retention-days: 7

  core-dependencies:
    name: Independent core without transports or SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/core-consumer
      - run: cargo run --manifest-path tests/core-consumer/Cargo.toml
      - name: Guard library dependency boundary
        run: |
          python3 - <<'PY'
          import re, subprocess
          graph = subprocess.check_output([
              "cargo", "tree", "--manifest-path", "tests/core-consumer/Cargo.toml",
              "--edges", "normal,build", "--prefix", "none", "--format", "{p}",
          ], text=True)
          forbidden = re.findall(r"^(?:tokio|reqwest|hyper|rustls|native-tls|openssl-sys|sqlx|sqlx-core|sqlx-postgres|regex|fuzzy-matcher) v.*", graph, re.M)
          if forbidden:
              raise SystemExit("Unexpected core dependencies: " + ", ".join(forbidden))
          PY
